services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pikepike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pikepike_local_demo}
      POSTGRES_DB: pikepike
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pikepike_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pikepike -d pikepike"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://pikepike:${POSTGRES_PASSWORD:-pikepike_local_demo}@db:5432/pikepike
      HOST: 0.0.0.0
      PORT: 3001
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  pikepike_data:
