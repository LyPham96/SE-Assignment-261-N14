services:
  init:
    build:
      context: .
      target: api
    command: ["npm", "run", "setup", "-w", "server"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env}
    restart: "no"
  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL_POOLED:-${DATABASE_URL}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      IOT_KEY: ${IOT_KEY:-pikepike-local-demo-device-key}
      TRIP_UNLOCK_FEE: ${TRIP_UNLOCK_FEE:-0}
      TRIP_MINUTE_RATE: ${TRIP_MINUTE_RATE:-0}
      TRIP_KM_RATE: ${TRIP_KM_RATE:-0}
      USE_REAL_IOT: ${USE_REAL_IOT:-false}
      DEMO_IOT: ${DEMO_IOT:-true}
      CHARGING_BATTERY_WEIGHT: ${CHARGING_BATTERY_WEIGHT:-1}
      CHARGING_WAIT_WEIGHT: ${CHARGING_WAIT_WEIGHT:-1}
      CHARGING_OVERLOAD_RATIO: ${CHARGING_OVERLOAD_RATIO:-0.95}
      SIM_BATTERY_PCT_PER_KM: ${SIM_BATTERY_PCT_PER_KM:-1}
      SIM_KM_PER_MINUTE: ${SIM_KM_PER_MINUTE:-0.25}
      SCENARIO_MAX_INTENSITY: ${SCENARIO_MAX_INTENSITY:-500}
      SCENARIO_MIN_DURATION: ${SCENARIO_MIN_DURATION:-5}
      SCENARIO_MAX_DURATION: ${SCENARIO_MAX_DURATION:-240}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "${API_BIND_HOST:-0.0.0.0}:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
  web:
    profiles: [debug]
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
