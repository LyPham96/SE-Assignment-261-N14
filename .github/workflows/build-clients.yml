name: Docker server and Android client
on:
  pull_request:
  push:
    branches: [main, m3-m4, zip-branch]
  workflow_dispatch:

jobs:
  android-with-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - run: npm ci
      - name: Build and start Docker server with an isolated local database
        run: |
          docker compose -f compose.yaml -f compose.postgres.yaml up --build -d --wait --wait-timeout 180 api
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/api/health
      - run: npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: pikepike-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Allow the Android emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native login, cookie persistence and logout against Docker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd android && java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/androidTests/
      - name: Docker logs
        if: always()
        run: docker compose -f compose.yaml -f compose.postgres.yaml logs --no-color
      - name: Stop the test server
        if: always()
        run: docker compose -f compose.yaml -f compose.postgres.yaml down
